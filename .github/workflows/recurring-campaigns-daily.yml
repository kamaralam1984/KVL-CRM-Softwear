name: Birthday & Seasonal Campaigns

# Phase 33 — roz ek baar (early morning IST) auto-run. Manual bhi chala sakte ho.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  run-recurring-campaigns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Trigger birthday/seasonal campaigns
        env:
          OUTREACH_RECURRING_URL: ${{ secrets.OUTREACH_RECURRING_URL }}
          OUTREACH_RECURRING_CRON_SECRET: ${{ secrets.OUTREACH_RECURRING_CRON_SECRET }}
        run: node crm-app/scripts/run-recurring-campaigns.mjs
