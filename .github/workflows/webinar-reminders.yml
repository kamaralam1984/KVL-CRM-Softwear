name: Webinar Reminder Cron

# Phase 45 — runs every 15 min (reminders fire relative to each webinar's
# own scheduled_at, unlike leadgen-daily.yml's once-a-day batch). Manual
# trigger also available.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  send-due-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Send due webinar reminders
        env:
          WEBINAR_REMINDER_URL: ${{ secrets.WEBINAR_REMINDER_URL }}
          WEBINAR_REMINDER_CRON_SECRET: ${{ secrets.WEBINAR_REMINDER_CRON_SECRET }}
        run: node crm-app/scripts/run-webinar-reminders.mjs
